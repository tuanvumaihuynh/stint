name: macOS CI

# Runs on macOS runners, so only when something the app is built from changes.
on:
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "macos/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "justfile"
      - ".github/workflows/macos-ci.yaml"
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "macos/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "justfile"
      - ".github/workflows/macos-ci.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  app:
    name: App (macOS)
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just app-test

  release-build:
    name: Release build (macOS)
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # Packs the universal app and launches it from the disk image, as a release would.
      - run: just release 0.0.0
      - run: just smoke-test 0.0.0
