name: macOS CI

# Runs on macOS runners, so only when something the app is built from changes. The
# release build runs only when packaging or the database it migrates changes.
on:
  pull_request:
    branches: [main]
    paths: &app-paths
      - "crates/**"
      - "macos/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/macos-ci.yaml"
      - ".github/workflows/release.yaml"
  push:
    branches: [main]
    paths: *app-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      packaging: ${{ steps.filter.outputs.packaging }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            packaging:
              - "macos/scripts/**"
              - "macos/Info.plist"
              - "macos/sparkle-public-key.txt"
              - "macos/Stint.xcodeproj/**"
              - "crates/stint-core/src/store/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - ".github/workflows/macos-ci.yaml"
              - ".github/workflows/release.yaml"

  app:
    name: App (macOS)
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just app-test

  release-build:
    name: Release build (macOS)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.packaging == 'true'
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # Packs the universal app and launches it from the disk image, as a release would.
      - run: just release 0.0.0
      - run: just smoke-test 0.0.0
