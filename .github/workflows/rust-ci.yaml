name: Rust CI

# Runs only when something the Rust workspace is built or checked from changes.
on:
  pull_request:
    branches: [main]
    paths: &rust-paths
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "clippy.toml"
      - ".github/workflows/rust-ci.yaml"
  push:
    branches: [main]
    paths: *rust-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just test

  vuln:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-audit
      - run: just vuln
