name: Rust CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just test

  app:
    name: App (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just app-test

  release-build:
    name: Release build (macOS)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # Packs the universal app and launches it from the disk image, as a release would.
      - run: just release 0.0.0
      - run: just smoke-test 0.0.0

  vuln:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-audit
      - run: just vuln
