[workspace]
resolver = "3"
members = ["crates/stint-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/tuanvumaihuynh/stint"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
